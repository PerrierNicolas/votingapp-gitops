apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: vote-prod
  namespace: argocd

spec:
  project: voting

  source:
    repoURL: https://github.com/PerrierNicolas/votingapp-gitops.git
    targetRevision: HEAD
    path: overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: vote-prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
