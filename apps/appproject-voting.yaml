apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: voting
  namespace: argocd

spec:
  description: Projet Voting App

  sourceRepos:
    - https://github.com/PerrierNicolas/votingapp-gitops.git

  destinations:
    - namespace: vote-dev
      server: https://kubernetes.default.svc

    - namespace: vote-prod
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
