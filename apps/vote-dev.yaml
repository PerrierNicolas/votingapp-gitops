apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: vote-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/PerrierNicolas/votingapp-gitops.git
    targetRevision: HEAD
    path: overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: vote-dev

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
